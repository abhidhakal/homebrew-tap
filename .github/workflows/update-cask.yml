name: Update AuthG Cask

on:
  schedule:
    # Check for new releases every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [new-release]

permissions:
  contents: write

jobs:
  update-cask:
    runs-on: macos-latest
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4

      - name: Check latest AuthG release and update Cask
        run: |
          set -euo pipefail

          RELEASE_JSON=$(curl -sSL https://api.github.com/repos/abhidhakal/authg-app/releases/latest)
          LATEST_TAG=$(echo "$RELEASE_JSON" | grep '"tag_name":' | head -n1 | sed -E 's/.*"tag_name": *"([^"]+)".*/\1/')
          LATEST_VERSION=$(echo "$LATEST_TAG" | sed 's/^v//')

          if [ -z "$LATEST_VERSION" ]; then
            echo "Could not fetch latest release version from GitHub."
            exit 1
          fi

          CURRENT_VERSION=$(grep 'version "' Casks/authg.rb | head -n1 | sed -E 's/.*version "([^"]+)".*/\1/')

          echo "Current Cask version: $CURRENT_VERSION"
          echo "Latest Release version: $LATEST_VERSION"

          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "Cask is already up to date ($CURRENT_VERSION)."
            exit 0
          fi

          ARM_URL="https://github.com/abhidhakal/authg-app/releases/download/${LATEST_TAG}/AuthG_${LATEST_VERSION}_aarch64.dmg"
          X64_URL="https://github.com/abhidhakal/authg-app/releases/download/${LATEST_TAG}/AuthG_${LATEST_VERSION}_x64.dmg"

          echo "Fetching ARM64 DMG: $ARM_URL"
          ARM_SHA=$(curl -sSL "$ARM_URL" | shasum -a 256 | awk '{print $1}')

          echo "Fetching x64 DMG: $X64_URL"
          X64_SHA=$(curl -sSL "$X64_URL" | shasum -a 256 | awk '{print $1}')

          if [ -z "$ARM_SHA" ] || [ -z "$X64_SHA" ]; then
            echo "Failed to compute checksums."
            exit 1
          fi

          echo "New ARM64 SHA: $ARM_SHA"
          echo "New x64 SHA:   $X64_SHA"

          cat <<CASK > Casks/authg.rb
cask "authg" do
  version "${LATEST_VERSION}"

  if Hardware::CPU.arm?
    url "https://github.com/abhidhakal/authg-app/releases/download/v#{version}/AuthG_#{version}_aarch64.dmg",
        verified: "github.com/abhidhakal/authg-app/"
    sha256 "${ARM_SHA}"
  else
    url "https://github.com/abhidhakal/authg-app/releases/download/v#{version}/AuthG_#{version}_x64.dmg",
        verified: "github.com/abhidhakal/authg-app/"
    sha256 "${X64_SHA}"
  end

  name "AuthG"
  desc "Open-source, offline desktop 2FA authenticator for the menu bar"
  homepage "https://authg.abhinavdhakal.com"

  depends_on macos: ">= :catalina"

  app "AuthG.app"

  zap trash: [
    "~/Library/Application Support/com.authg.desktop",
    "~/Library/Caches/com.authg.desktop",
    "~/Library/Preferences/com.authg.desktop.plist",
    "~/Library/WebKit/com.authg.desktop",
  ]
end
CASK

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/authg.rb
          git commit -m "chore(cask): update AuthG to v${LATEST_VERSION}"
          git push
